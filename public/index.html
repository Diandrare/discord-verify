<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Verification</title>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 420px;
            width: 90%;
        }
        h2 { margin-bottom: 0.5rem; color: #38bdf8; letter-spacing: 1px; }
        p { font-size: 0.95rem; color: #94a3b8; margin-bottom: 1.5rem; line-height: 1.5; }
        .cf-turnstile { display: flex; justify-content: center; margin-bottom: 1.5rem; }
        button {
            background-color: #22c55e;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        button:hover { background-color: #16a34a; }
        #status { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>❖ VERIFICATION</h2>
        <p>Please complete the captcha below to verify your Discord account.</p>
        
        <form id="verifyForm">
            <!-- Site Key Turnstile Cloudflare Kamu -->
            <div class="cf-turnstile" data-sitekey="0x4AAAAAAFStKXiw28UiLX3m" data-theme="dark"></div>
            <button type="submit" id="btnSubmit">Verify Me</button>
        </form>
        <div id="status"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('user_id');

        document.getElementById('verifyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            const statusDiv = document.getElementById('status');
            
            if (!userId) {
                statusDiv.style.color = '#ef4444';
                statusDiv.innerText = 'Error: Invalid Request (Missing User ID).';
                return;
            }

            const formData = new FormData(e.target);
            const cfToken = formData.get('cf-turnstile-response');

            if (!cfToken) {
                statusDiv.style.color = '#ef4444';
                statusDiv.innerText = 'Please complete the captcha first!';
                return;
            }

            btn.disabled = true;
            btn.innerText = 'Verifying...';
            statusDiv.innerText = '';

            try {
                const res = await fetch('/api/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, cf_response: cfToken })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    document.querySelector('.card').innerHTML = `
                        <div style="font-size: 3rem; margin-bottom: 1rem;">✅</div>
                        <h2 style="color: #4ade80;">Verification Successful!</h2>
                        <p>Your roles have been updated in Discord. You can safely close this tab now.</p>
                    `;
                } else {
                    statusDiv.style.color = '#ef4444';
                    statusDiv.innerText = data.message || 'Verification failed. Please try again.';
                    btn.disabled = false;
                    btn.innerText = 'Verify Me';
                }
            } catch (err) {
                statusDiv.style.color = '#ef4444';
                statusDiv.innerText = 'Network error. Please try again.';
                btn.disabled = false;
                btn.innerText = 'Verify Me';
            }
        });
    </script>
</body>
</html>
